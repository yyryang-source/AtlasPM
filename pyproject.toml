[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlaspm"
version = "0.6.0"
description = "Local-first portfolio analytics and risk research for cash and margin accounts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AtlasPM contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.optional-dependencies]
market = ["yfinance>=1.8.0,<2.0"]
ml = ["lightgbm>=4.5.0,<5.0"]
native = ["numpy>=2.0,<3.0"]

[project.scripts]
atlaspm = "atlaspm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
