[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlaspm"
version = "0.7.0"
description = "Local-first portfolio analytics and risk research for cash and margin accounts"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AtlasPM contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
]
dependencies = ["tzdata>=2025.2; sys_platform == \"win32\""]

[project.optional-dependencies]
market = ["yfinance>=1.8.0,<2.0"]
calendar = ["pandas_market_calendars>=4.6,<6.0"]
ml = ["lightgbm>=4.5.0,<5.0"]
native = ["numpy>=2.0,<3.0"]
portfolio = ["numpy>=2.0,<3.0", "scipy>=1.13,<2.0"]
lake = ["duckdb>=1.2,<2.0", "boto3>=1.34,<2.0"]
hf = ["huggingface_hub>=0.32,<2.0"]

[project.scripts]
atlaspm = "atlaspm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
