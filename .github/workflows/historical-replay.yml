name: Historical replay
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  replay:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[portfolio]"
      - run: python -m unittest discover -s tests -p "test_historical_replay*.py" -v
      - run: python -m atlaspm.engine.replay --file examples/historical_replay_synthetic.json
      - run: python -m atlaspm.engine.replay_performance --file examples/historical_replay_comparison.json
