name: Stock 5m Parquet lake checks

on:
  push:
  pull_request:

jobs:
  duckdb-lake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install lake and NYSE calendar extras
        run: python -m pip install -e ".[lake,calendar,hf]"
      - name: Verify 1-minute to 5-minute DuckDB Parquet transformation
        run: python -m unittest discover -s tests -p "test_stock5m_flatfiles.py" -v
      - name: Verify offline complete-archive plan
        run: python -m atlaspm.cli market-db stock-5m-backfill --start 2000-01-01 --end 2026-11-23 --dry-run
      - name: Confirm no live data download or order access
        run: python -m atlaspm.cli market-db stock-5m-status

      - name: Verify Hugging Face monthly 1m to 5m conversion (offline fixtures)
        run: python -m unittest discover -s tests -p "test_hf_stock5m.py" -v
      - name: Verify offline Hugging Face archive planning without network
        run: python -m atlaspm.cli market-db hf-5m-backfill --start-month 2000-01 --end-month 2026-03 --max-months 0 --dry-run
      - name: Test offline NYSE session and benchmark HF data audit
        run: python -m unittest discover -s tests -p "test_hf_stock5m_audit.py" -v

      - name: Verify independent daily reconciliation without remote requests
        run: python -m unittest discover -s tests -p "test_hf_stock5m_reconcile.py" -v
