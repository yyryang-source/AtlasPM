name: Stock 5m Parquet lake checks

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  duckdb-lake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install lake and NYSE calendar extras
        run: python -m pip install -e ".[lake,calendar,hf]"
      - name: Verify 1-minute to 5-minute DuckDB Parquet transformation
        run: python -m unittest discover -s tests -p "test_stock5m_flatfiles.py" -v
      - name: Verify offline complete-archive plan
        run: python -m atlaspm.cli market-db stock-5m-backfill --start 2000-01-01 --end 2026-11-23 --dry-run
      - name: Confirm no live data download or order access
        run: python -m atlaspm.cli market-db stock-5m-status

      - name: Verify Hugging Face monthly 1m to 5m conversion (offline fixtures)
        run: python -m unittest discover -s tests -p "test_hf_stock5m.py" -v
      - name: Verify offline Hugging Face archive planning without network
        run: python -m atlaspm.cli market-db hf-5m-backfill --start-month 2000-01 --end-month 2026-03 --max-months 0 --dry-run
      - name: Test offline NYSE session and benchmark HF data audit
        run: python -m unittest discover -s tests -p "test_hf_stock5m_audit.py" -v
      - name: Test resumable offline full-history QC and cache invalidation
        run: python -m unittest discover -s tests -p "test_hf_stock5m_batch.py" -v
      - name: Verify full-archive audit CLI plan (no data, no network)
        run: python -m atlaspm.cli market-db hf-5m-audit-batch --start-month 2000-01 --end-month 2026-03 --dry-run

      - name: Verify V4 session diagnostics and non-destructive research view
        run: python -m unittest discover -s tests -p "test_hf_stock5m_session_v4.py" -v
      - name: Verify V4 offline CLI
        run: python -m atlaspm.cli market-db hf-5m-session-v4 --dry-run

      - name: Verify V5 identity, corporate action and PIT evidence guards
        run: python -m unittest discover -s tests -p "test_hf_stock5m_certification_v5.py" -v
      - name: Verify V5 CLI without evidence (must remain blocked)
        run: python -m atlaspm.cli market-db hf-5m-certify-v5

      - name: Verify V5.1 public evidence collector with offline fixtures
        run: python -m unittest discover -s tests -p "test_hf_stock5m_evidence_v51.py" -v
      - name: Verify V5.1 zero-network evidence plan
        run: python -m atlaspm.cli market-db hf-5m-evidence-v51

      - name: Verify V5.2 SEC filing index and evidence extraction offline
        run: python -m unittest discover -s tests -p "test_hf_stock5m_filings_v52.py" -v

      - name: Verify V5.3 historical security master and PIT guards
        run: python -m unittest discover -s tests -p "test_hf_stock5m_security_master_v53.py" -v
      - name: Verify empty V5.3 ledger cannot authorize training
        run: python -m atlaspm.cli market-db hf-5m-security-inventory-v53

      - name: Verify V5.4 anomaly discovery and evidence budget
        run: python -m unittest discover -s tests -p "test_hf_stock5m_discovery_v54.py" -v

      - name: Verify V5.5 raw evidence matching and batch budget
        run: python -m unittest discover -s tests -p "test_hf_stock5m_evidence_v55.py" -v

      - name: Verify independent daily reconciliation without remote requests
        run: python -m unittest discover -s tests -p "test_hf_stock5m_reconcile.py" -v

  bulk-planner:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify historical bulk PowerShell plan without network
        shell: pwsh
        run: |
          $plan = & .\scripts\data\Invoke-HFAllMarketBackfill.ps1 -DryRun | ConvertFrom-Json
          if ($plan.months_selected -ne 315) { throw "Expected 315 available source months" }
          if ($plan.effective_end_month -ne "2026-03") { throw "Unexpected available archive end" }
          if ($plan.unavailable_requested_months.Count -ne 8) { throw "Missing 2026-04..11 gap" }
          if ($plan.network_downloads -ne 0) { throw "Dry-run must not download" }
          Write-Host "Offline all-market history planner verified"

      - name: Set up Python for Windows lake regression
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Windows lake extras
        run: python -m pip install -e ".[lake,calendar]"
      - name: Verify V5.2 filing evidence cache on Windows
        run: python -m unittest discover -s tests -p "test_hf_stock5m_filings_v52.py" -v

      - name: Verify V5.3 ledger and path handling on Windows
        run: python -m unittest discover -s tests -p "test_hf_stock5m_security_master_v53.py" -v

      - name: Verify V5.4 anomaly discovery on Windows
        run: python -m unittest discover -s tests -p "test_hf_stock5m_discovery_v54.py" -v

      - name: Verify V5.5 evidence matching on Windows
        run: python -m unittest discover -s tests -p "test_hf_stock5m_evidence_v55.py" -v
