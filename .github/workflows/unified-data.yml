name: Unified data reader checks
permissions:
  contents: read
on:
  push:
  pull_request:
jobs:
  unified-reader:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e ".[lake,calendar]"
      - run: python -m unittest discover -s tests -p "test_unified_data.py" -v
      - run: python -m unittest discover -s tests -p "test_unified_pipeline.py" -v
      - run: python -m unittest discover -s tests -p "test_quality_review.py" -v
      - run: python -m unittest discover -s tests -p "test_real_dataset_v6.py" -v
