name: factor-db

on:
  push:
    paths:
      - "src/atlaspm/data/factor_db.py"
      - "src/atlaspm/data/factor_eval.py"
      - "src/atlaspm/data/factor_v3.py"
      - "src/atlaspm/data/market_db.py"
      - "tests/data/test_factor_db.py"
      - "tests/data/test_factor_eval.py"
      - "tests/data/test_factor_v3.py"
      - ".github/workflows/factor-db.yml"
  pull_request:
    paths:
      - "src/atlaspm/data/factor_db.py"
      - "src/atlaspm/data/factor_eval.py"
      - "src/atlaspm/data/factor_v3.py"
      - "src/atlaspm/data/market_db.py"
      - "tests/data/test_factor_db.py"
      - "tests/data/test_factor_eval.py"
      - "tests/data/test_factor_v3.py"
      - ".github/workflows/factor-db.yml"

jobs:
  offline-factor-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install local factor research dependencies
        run: python -m pip install -e ".[lake]"
      - name: Validate factor contracts and synthetic Parquet integration
        run: python -m unittest discover -s tests -p "test_factor_db.py" -v
      - name: Verify experimental factor evaluation on synthetic fixtures
        run: python -m unittest discover -s tests -p "test_factor_eval.py" -v
      - name: Verify V3 normalization, neutralization, IC embargo and composite with synthetic data
        run: python -m unittest discover -s tests -p "test_factor_v3.py" -v
      - name: Protect top-level CLI compatibility
        run: python -m unittest discover -s tests -p "test_cli_families.py" -v
