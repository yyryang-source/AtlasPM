name: AI research synthetic
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[portfolio,research-ml,research-io]"
      - run: python -m unittest discover -s tests -p "test_training*.py" -v
      - run: python -m atlaspm.research.training_benchmark --days 40 --assets 32 --array-budget-mib 1
      - name: Synthetic research and OMS acceptance smoke
        if: matrix.python == '3.12'
        run: python -m atlaspm.research.training_acceptance
  sequence:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install "torch>=2.6,<3.0" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[research-deep]"
      - run: python -m unittest discover -s tests -p "test_training_sequence_ensemble.py" -v
      - run: python -m unittest discover -s tests -p "test_training_artifacts.py" -v

  alpha-windows-py314:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -e ".[portfolio]"
      - run: python -W error::ResourceWarning -m unittest discover -s tests -p "test_training_autonomous_alpha.py" -v

  full-release:
    name: Full dependency release gate (Windows Python 3.14)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install "torch>=2.6,<3.0" --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e ".[ml,native,calendar,lake,research-io,portfolio,research-ml,research-deep]"
      - run: python -m pip check
      - run: python scripts/maintenance/verify_release.py --minimum-passed 1117
      - name: Unified offline system acceptance (no real credentials)
        run: python scripts/maintenance/benchmark_unified_data.py --offline
