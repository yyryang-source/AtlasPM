name: AI stock ranker fitted-model checks

on:
  push:
    branches:
      - feature/ai-stock-ranker-lightgbm-v1
  pull_request:
    paths:
      - "src/atlaspm/ai_stock_ranker.py"
      - "tests/test_ai_stock_ranker.py"
      - ".github/workflows/ai-stock-ranker-checks.yml"
  workflow_dispatch:

jobs:
  fitted-lightgbm:
    name: Fit and predict LightGBM stock-selection fixture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install fitted ML dependencies
        run: python -m pip install -e ".[ml]"
      - name: Run genuine LightGBM train and rank regression tests
        run: python -m unittest discover -s tests -p "test_ai_stock_ranker.py" -v
      - name: Verify ML backend is installed
        run: python -c "import lightgbm; print('LightGBM ' + lightgbm.__version__)"
