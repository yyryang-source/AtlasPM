name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test CLI
        run: python -m atlaspm.cli analyze --file examples/portfolio.json

      - name: Smoke test optimizer
        run: python -m atlaspm.cli optimize --file examples/optimizer.json
      - name: Smoke test read-only risk budget
        run: python -m atlaspm.cli risk-check --file examples/optimizer.json --leverage 1 --output local_data/ci_risk_budget.json
      - name: Smoke test adaptive risk budgets (synthetic offline history)
        run: python -m atlaspm.cli backtest-risk --file examples/synthetic_prices.csv --lookback-days 40 --rebalance-days 20 --max-leverage 2 --max-volatility 0.07 --output local_data/ci_adaptive_backtest.json
      - name: Smoke test tail-loss historical ES budget (synthetic offline)
        run: python -m atlaspm.cli backtest-risk --file examples/synthetic_prices.csv --lookback-days 40 --rebalance-days 20 --max-leverage 2 --max-volatility 0.07 --max-daily-tail-loss 0.03 --tail-fraction 0.05 --output local_data/ci_tail_backtest.json
      - name: Smoke test institutional paper-only risk gate
        run: python -m atlaspm.cli institutional-check --file examples/institutional_scenario.json --output local_data/ci_institutional_preflight.json
      - name: Smoke test institutional read-only ledger (synthetic accounts)
        run: python -m atlaspm.cli ledger-report --file examples/institutional_ledger.json --output local_data/ci_institutional_ledger.json
      - name: Smoke test paper-only equity add/reduce planner (fully synthetic)
        run: python -m atlaspm.cli plan-equity --ledger examples/institutional_ledger.json --plan examples/institutional_equity_plan.json --output local_data/ci_equity_plan.json
      - name: Smoke test synthetic combined multi-asset basket
        run: python -m atlaspm.cli plan-basket --ledger examples/institutional_batch_ledger.json --plan examples/institutional_batch_plan.json --output local_data/ci_institutional_batch.json
      - name: Smoke test offline Paper OMS replay (synthetic fills)
        run: python -m atlaspm.cli oms-replay --ledger examples/institutional_batch_ledger.json --plan examples/institutional_batch_plan.json --events examples/paper_oms_events.json --output local_data/ci_paper_oms.json
      - name: Smoke test after-fill risk and audit chain
        run: python -m unittest discover -s tests -p "test_oms_controls.py" -v
      - name: Smoke test offline broker export reconciliation (synthetic only)
        run: python -m atlaspm.cli broker-reconcile --ledger examples/institutional_batch_ledger.json --snapshot examples/broker_export_synthetic.json --output local_data/ci_broker_reconcile.json
      - name: Smoke test synthetic IBKR read-only Gateway without network
        run: python -m atlaspm.cli ibkr-readonly --fixture examples/ibkr_gateway_synthetic.json --account DU1234567 --output local_data/ci_ibkr_private_capture.json
      - name: Smoke test synthetic IBKR conid mapping diagnostic (no network)
        run: python -m atlaspm.cli ibkr-map-check --capture local_data/ci_ibkr_private_capture.json --mapping examples/ibkr_mapping_synthetic.json --output local_data/ci_ibkr_mapping.json
      - name: Smoke test synthetic IBKR financing and margin reconciliation (no network)
        run: python -m atlaspm.cli ibkr-financing-check --capture local_data/ci_ibkr_private_capture.json --mapping examples/ibkr_mapping_synthetic.json --statement examples/ibkr_financing_synthetic.json --output local_data/ci_ibkr_financing.json
