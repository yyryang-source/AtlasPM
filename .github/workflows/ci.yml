name: Python checks

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Audit repository source structure
        run: python scripts/maintenance/audit_source.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test CLI
        run: python -m atlaspm.cli analyze --file examples/portfolio.json
      - name: Smoke test supervised ML risk forecasts and autonomous cash-only rebalancing (offline)
        run: python -m atlaspm.cli ml-rebalance-backtest --file examples/synthetic_prices.csv --feature-days 20 --forecast-days 5 --min-train 30 --rebalance-days 10 --max-exposure 1 --output local_data/ci_ml_dynamic_rebalance.json

      - name: Smoke test optimizer
        run: python -m atlaspm.cli optimize --file examples/optimizer.json
      - name: Smoke test read-only risk budget
        run: python -m atlaspm.cli risk-check --file examples/optimizer.json --leverage 1 --output local_data/ci_risk_budget.json
      - name: Smoke test adaptive risk budgets (synthetic offline history)
        run: python -m atlaspm.cli backtest-risk --file examples/synthetic_prices.csv --lookback-days 40 --rebalance-days 20 --max-leverage 2 --max-volatility 0.07 --output local_data/ci_adaptive_backtest.json
      - name: Smoke test tail-loss historical ES budget (synthetic offline)
        run: python -m atlaspm.cli backtest-risk --file examples/synthetic_prices.csv --lookback-days 40 --rebalance-days 20 --max-leverage 2 --max-volatility 0.07 --max-daily-tail-loss 0.03 --tail-fraction 0.05 --output local_data/ci_tail_backtest.json
      - name: Smoke test institutional paper-only risk gate
        run: python -m atlaspm.cli institutional-check --file examples/institutional_scenario.json --output local_data/ci_institutional_preflight.json
      - name: Smoke test institutional read-only ledger (synthetic accounts)
        run: python -m atlaspm.cli ledger-report --file examples/institutional_ledger.json --output local_data/ci_institutional_ledger.json
      - name: Smoke test paper-only equity add/reduce planner (fully synthetic)
        run: python -m atlaspm.cli plan-equity --ledger examples/institutional_ledger.json --plan examples/institutional_equity_plan.json --output local_data/ci_equity_plan.json
      - name: Smoke test synthetic combined multi-asset basket
        run: python -m atlaspm.cli plan-basket --ledger examples/institutional_batch_ledger.json --plan examples/institutional_batch_plan.json --output local_data/ci_institutional_batch.json
      - name: Smoke test offline Paper OMS replay (synthetic fills)
        run: python -m atlaspm.cli oms-replay --ledger examples/institutional_batch_ledger.json --plan examples/institutional_batch_plan.json --events examples/paper_oms_events.json --output local_data/ci_paper_oms.json
      - name: Smoke test after-fill risk and audit chain
        run: python -m unittest discover -s tests -p "test_oms_controls.py" -v
      - name: Smoke test offline broker export reconciliation (synthetic only)
        run: python -m atlaspm.cli broker-reconcile --ledger examples/institutional_batch_ledger.json --snapshot examples/broker_export_synthetic.json --output local_data/ci_broker_reconcile.json
      - name: Smoke test synthetic IBKR read-only Gateway without network
        run: python -m atlaspm.cli ibkr-readonly --fixture examples/ibkr_gateway_synthetic.json --account DU1234567 --output local_data/ci_ibkr_private_capture.json
      - name: Smoke test synthetic IBKR conid mapping diagnostic (no network)
        run: python -m atlaspm.cli ibkr-map-check --capture local_data/ci_ibkr_private_capture.json --mapping examples/ibkr_mapping_synthetic.json --output local_data/ci_ibkr_mapping.json
      - name: Smoke test synthetic IBKR financing and margin reconciliation (no network)
        run: python -m atlaspm.cli ibkr-financing-check --capture local_data/ci_ibkr_private_capture.json --mapping examples/ibkr_mapping_synthetic.json --statement examples/ibkr_financing_synthetic.json --output local_data/ci_ibkr_financing.json
      - name: Smoke test read-only IBKR securities margin monitor (synthetic, no network)
        run: python -m atlaspm.cli ibkr-margin-monitor --fixture examples/ibkr_gateway_synthetic.json --account DU1234567 --output local_data/ci_ibkr_margin_monitor.json
      - name: Smoke test static financing and margin stress (synthetic, no network)
        run: python -m atlaspm.cli ibkr-stress --monitor local_data/ci_ibkr_margin_monitor.json --financing local_data/ci_ibkr_financing.json --scenarios examples/ibkr_margin_stress_synthetic.json --output local_data/ci_ibkr_margin_stress.json
      - name: Smoke test multiasset correlation budget (synthetic, no network)
        run: python -m atlaspm.cli ibkr-multiasset-budget --stress local_data/ci_ibkr_margin_stress.json --assumptions examples/ibkr_multiasset_budget_synthetic.json --output local_data/ci_ibkr_multiasset_budget.json
      - name: Smoke test reverse margin stress (synthetic, no network)
        run: python -m atlaspm.cli ibkr-reverse-stress --budget local_data/ci_ibkr_multiasset_budget.json --assumptions examples/ibkr_reverse_stress_synthetic.json --output local_data/ci_ibkr_reverse_stress.json
      - name: Smoke test complete private IBKR risk audit chain (synthetic, no network)
        run: python -m atlaspm.cli ibkr-risk-audit --monitor local_data/ci_ibkr_margin_monitor.json --financing local_data/ci_ibkr_financing.json --stress local_data/ci_ibkr_margin_stress.json --multiasset local_data/ci_ibkr_multiasset_budget.json --reverse local_data/ci_ibkr_reverse_stress.json --output local_data/ci_ibkr_risk_audit.json
      - name: Smoke test audit baseline SHA-256 comparison
        run: python -m atlaspm.cli ibkr-risk-audit --monitor local_data/ci_ibkr_margin_monitor.json --financing local_data/ci_ibkr_financing.json --stress local_data/ci_ibkr_margin_stress.json --multiasset local_data/ci_ibkr_multiasset_budget.json --reverse local_data/ci_ibkr_reverse_stress.json --compare local_data/ci_ibkr_risk_audit.json --output local_data/ci_ibkr_risk_audit_second.json
      - name: Smoke test comparison of two local unsigned risk audits
        run: python -m atlaspm.cli ibkr-audit-diff --previous local_data/ci_ibkr_risk_audit.json --current local_data/ci_ibkr_risk_audit_second.json --output local_data/ci_ibkr_risk_audit_diff.json
      - name: Smoke test offline HTML dashboard (synthetic no network)
        run: |
          cp local_data/ci_ibkr_margin_monitor.json local_data/margin_monitor_fixture.json
          cp local_data/ci_ibkr_financing.json local_data/ibkr_financing_check.json
          cp local_data/ci_ibkr_margin_stress.json local_data/ibkr_margin_stress.json
          cp local_data/ci_ibkr_multiasset_budget.json local_data/ibkr_multiasset_budget.json
          cp local_data/ci_ibkr_reverse_stress.json local_data/ibkr_reverse_stress.json
          cp local_data/ci_ibkr_risk_audit.json local_data/ibkr_risk_audit.json
          cp local_data/ci_ibkr_risk_audit_second.json local_data/ibkr_risk_audit_second.json
          cp local_data/ci_ibkr_risk_audit_diff.json local_data/ibkr_risk_audit_diff.json
          python -m atlaspm.cli ibkr-dashboard --folder local_data --output local_data/ci_atlaspm_dashboard.html
          test -s local_data/ci_atlaspm_dashboard.html

  windows-ml-path-regression:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install AtlasPM
        run: python -m pip install -e .
      - name: Reproduce native Windows ML CLI and unit tests
        run: python -m unittest discover -s tests -p "test_ml_dynamic_rebalance*.py" -v
      - name: Run synthetic ML training in PowerShell
        run: python -m atlaspm.cli ml-rebalance-backtest --file examples/synthetic_prices.csv --min-train 30 --output local_data/windows_ml_rebalance.json
      - name: Confirm output has no absolute profile paths
        shell: pwsh
        run: |
          $report = Get-Content local_data/windows_ml_rebalance.json -Raw | ConvertFrom-Json
          if ($report.live_execution_enabled -ne $false) { throw "Unsafe trading enabled" }
          if (-not $report.is_trained_machine_learning_model) { throw "No trained model" }

  open-source-lightgbm-training:
    name: lightgbm-training (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install optional LightGBM model dependency
        run: python -m pip install -e ".[ml]"
      - name: Run native fitted LightGBM leakage and backtest tests
        run: python -m unittest discover -s tests -p "test_ml_lightgbm*.py" -v
      - name: Train actual LightGBM model and run autonomous offline simulation
        run: python -m atlaspm.cli ml-rebalance-backtest --model lightgbm --file examples/synthetic_prices.csv --min-train 30 --rebalance-days 10 --max-exposure 1 --output local_data/ci_lightgbm_rebalance.json
      - name: Test mature-only risk model tournament selection, no hindsight and risk gates
        run: python -m unittest discover -s tests -p "test_ml_model_tournament*.py" -v
      - name: Smoke test automatic champion portfolio allocation
        run: python -m atlaspm.cli ml-model-tournament --file examples/synthetic_prices.csv --mode champion --min-train 30 --rebalance-days 10 --min-validated-rebalances 2 --max-exposure 1 --output local_data/ci_champion_tournament.json
      - name: Smoke test ensemble portfolio allocation
        run: python -m atlaspm.cli ml-model-tournament --file examples/synthetic_prices.csv --mode ensemble --min-train 30 --rebalance-days 10 --min-validated-rebalances 2 --max-exposure 1 --output local_data/ci_ensemble_tournament.json

  atlas-original-native-ai:
    name: in-house-model-training (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install original AtlasPM NumPy-only training extra
        run: python -m pip install -e ".[native]"
      - name: Train scratch dual-head model and validate no-leak + risk gates
        run: python -m unittest discover -s tests -p "test_atlas_regimenet*.py" -v
      - name: Exercise native original model walk-forward command
        run: python -m atlaspm.cli atlas-native-backtest --file examples/synthetic_prices.csv --min-train 60 --train-window 70 --epochs 12 --rebalance-days 10 --max-exposure 1 --output local_data/ci_atlas_native.json
      - name: Test independent Atlas RiskNet v2 single-head scratch training and future leakage
        run: python -m unittest discover -s tests -p "test_atlas_risknet*.py" -v
      - name: Verify offline paired native audit with no unmatched-data/leverage loopholes
        run: python -m unittest discover -s tests -p "test_atlas_robustness_audit.py" -v
      - name: Execute independent native RiskNet 0-1x cash allocation
        run: python -m atlaspm.cli atlas-native-backtest --architecture risknet --return-head-strength 0 --file examples/synthetic_prices.csv --min-train 60 --train-window 70 --epochs 12 --rebalance-days 10 --no-trade-band 0.05 --max-exposure 1 --output local_data/ci_atlas_risknet_v2.json
      - name: Validate original Atlas FusionNet multiscale and downside risk research
        run: python -m unittest discover -s tests -p "test_atlas_fusionnet*.py" -v
      - name: Train original FusionNet and exercise shrinkage correlation risk allocation
        run: python -m atlaspm.cli atlas-native-backtest --architecture fusion --return-head-strength 0 --fusion-allocator-mode shrinkage --file examples/synthetic_prices.csv --min-train 60 --train-window 70 --epochs 12 --rebalance-days 10 --no-trade-band 0.05 --max-exposure 1 --output local_data/ci_atlas_fusionnet.json
      - name: Exercise alternate FusionNet inverse-risk ablation mode
        run: python -m atlaspm.cli atlas-native-backtest --architecture fusion --return-head-strength 0 --fusion-allocator-mode inverse_risk --file examples/synthetic_prices.csv --min-train 60 --train-window 70 --epochs 12 --rebalance-days 10 --no-trade-band 0.05 --max-exposure 1 --output local_data/ci_atlas_fusion_inverse.json

  full-optional-dependencies:
    name: Full optional dependency tests (Python 3.12, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU PyTorch
        run: python -m pip install "torch>=2.6,<3.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Install every optional dependency group
        run: python -m pip install -e ".[market,calendar,ml,native,research-io,research-deep,research-ml,portfolio,lake,hf,workbench]"
      - name: Check installed dependencies
        run: python -m pip check
      - name: Run complete test suite with all optional dependencies
        run: python -m unittest discover -s tests -v
      - name: Audit repository source structure
        run: python scripts/maintenance/audit_source.py

  ruff:
    name: Ruff source checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install "ruff>=0.9,<1.0"
      - name: Check unused imports, variables and deprecated module imports
        run: python -m ruff check src/atlaspm --select F401,F841,TID251
