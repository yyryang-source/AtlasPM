name: Python checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test CLI
        run: python -m atlaspm.cli analyze --file examples/portfolio.json

      - name: Smoke test optimizer
        run: python -m atlaspm.cli optimize --file examples/optimizer.json
      - name: Smoke test read-only risk budget
        run: python -m atlaspm.cli risk-check --file examples/optimizer.json --leverage 1 --output local_data/ci_risk_budget.json
      - name: Smoke test adaptive risk budgets (synthetic offline history)
        run: python -m atlaspm.cli backtest-risk --file examples/synthetic_prices.csv --lookback-days 40 --rebalance-days 20 --max-leverage 2 --max-volatility 0.07 --output local_data/ci_adaptive_backtest.json
      - name: Smoke test tail-loss historical ES budget (synthetic offline)
        run: python -m atlaspm.cli backtest-risk --file examples/synthetic_prices.csv --lookback-days 40 --rebalance-days 20 --max-leverage 2 --max-volatility 0.07 --max-daily-tail-loss 0.03 --tail-fraction 0.05 --output local_data/ci_tail_backtest.json
      - name: Smoke test institutional paper-only risk gate
        run: python -m atlaspm.cli institutional-check --file examples/institutional_scenario.json --output local_data/ci_institutional_preflight.json
